name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # NFR-5：覆盖率阈值（vitest.config.ts coverage.thresholds）只在 --coverage 下生效，
      # 因此 CI 必须显式跑一次 pnpm coverage，作为回归防线。
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm verify:client
