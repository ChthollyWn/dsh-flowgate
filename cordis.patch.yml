# FlowGate 组合包 patch 层（由 `package.json` 的 `dsh.bundle.patch` 引用）。
#
# 第一行把本包的 host 入口作为普通 Cordis 插件加载；
# `package.json` 的 `dsh.client` 声明让 Web 端加载 ./lib/client.js 作为浏览器半边。
#
# 下面是 FlowGate 的三个 Agent Preset（H25，写作依据：docs/impl/dsh-plugin-api-cheatsheet.md §3.3）。
# rc.5 的 preset 不是特殊语法，就是插入一行 `@deepseek-ai/dsh-agent-preset`，
# config 里给 id/name/description/order/plugins；子行与 patch 行同构。
# 行 id 固定（preset-*），profile patch 可以按 id 覆盖 config。
#
# 已验证（2026-10-30）：三个 preset 行在真实 DSH 0.2.1-rc.5 Web 宿主的 preset 菜单中出现
# （docs/screenshots/09-preset-menu.png）。仍未验证：在真实会话中**切换** preset 后的运行时行为；
# 精简组合（如 headless）缺 `agentPresets` 服务时 preset 行会 pending，可在 profile patch 里补
# `@deepseek-ai/dsh-agent-preset-registry`（config.default 指向已注册的 preset id）后用 `--patch` 启动。
# 若宿主组合缺少 `@deepseek-ai/dsh-agent-preset` 或 `@deepseek-ai/dsh-tool-fs`，本层会整体被跳过
# （skippedBundles），不影响 host 插件行与 /flow 命令、守卫、工具等核心功能。
- insert:
    - id: dsh-flowgate
      name: dsh-flowgate
      config:
        # 总开关（调试用）；正常保持 true。
        enabled: true

    # ── 工程模式：受管控项目的推荐会话 preset ────────────────────────────────
    - id: preset-flowgate
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: flowgate
        name: FlowGate 工程模式
        description: 硬约束开发流程：先澄清与设计，再按执行图 TDD，证据驱动验收；写操作由 FlowGate 守卫把关。
        order: 50
        plugins:
          # 人设 + 计划模式引导（T1.7）：先把决定、下一步和证据写清楚，再动手；
          # 输出压缩/上下文参数由宿主组合层（dsh-compaction-tool-result-pruner）统一配置，
          # 插件不硬编码宿主阈值（避免不同 RC 组合下配置被拒）。
          - id: flowgate-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你在 FlowGate 工程模式下工作：严格按阶段推进，先澄清需求与边界，再设计拆解，禁止跳步；每次行动前先用一句话说明「当前阶段、允许的动作、下一步」，先计划再执行；用证据而不是自述证明完成，输出保持简洁。'
          # 工具集（T1.7 / 03 §2.4）：工程模式明确拥有文件读写、搜索与技能工具；
          # 原生委派由守护进程 restrict + 守卫关闭，不在此列。
          - id: flowgate-tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: flowgate-tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: flowgate-tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

    # ── 执行者：flow_dispatch_next 派发的子 agent ───────────────────────────
    - id: preset-flowgate-executor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: flowgate-executor
        name: FlowGate 执行者
        description: 只负责一个任务卡：读写范围内文件、跑验证、回传结构化摘要；不能委派、不能提问。
        order: 51
        plugins:
          - id: executor-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 FlowGate 执行者子 agent，只完成分配给你的单个任务卡；只改任务范围，先用一句话说清要改什么，再执行；用 flow_verify 产生证据，完成后回传结构化摘要。'
          # 执行者工具集：文件读写、搜索与 shell（跑测试/构建）；没有委派工具。
          - id: executor-tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: executor-tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: executor-tool-bash
            name: '@deepseek-ai/dsh-tool-bash'

    # ── 只读取证：审查/调查子 agent（能力边界先由工具集保证，守卫兜底）──────
    - id: preset-flowgate-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: flowgate-reviewer
        name: FlowGate 只读取证
        description: 只读审查/调查：read/glob/grep/flow_diff + 结构化输出；没有写文件与 shell，不能委派。
        order: 52
        plugins:
          - id: reviewer-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 FlowGate 的独立审查者：只用只读工具取证，结论必须带 文件:行号，输出结构化 findings；不要修改任何文件。'
          # 只读文件工具（H25 肯定答案：tool-fs 的 read/write/edit 开关就是硬边界）。
          - id: reviewer-tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: reviewer-tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # rc.5 的 dsh-tool-fs-search 要求显式给出该字段（缺省会被 schema 拒绝，
              # 导致整个审查子 agent 无法启动；2026-10-31 真机发现）。
              sampleOverCapGlobResults: false
